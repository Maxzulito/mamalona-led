<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mamalona LED - Mesa 3D</title>

  <!-- Visor 3D -->

  <script type="module"
    src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      padding: 25px 15px 10px;
    }

    h1 {
      margin: 0;
      font-size: 32px;
    }

    p {
      color: #bbb;
    }

    model-viewer {
      width: 100%;
      height: 70vh;
      min-height: 500px;
      background: #181818;
    }

    .botones {
      padding: 20px;
    }

    button {
      background: #168cff;
      color: white;
      border: none;
      border-radius: 10px;
      padding: 14px 22px;
      margin: 5px;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #006edc;
    }
  </style>

</head>

<body>

  <header>
    <h1>🎲 MAMALONA LED</h1>
    <p>Visualiza nuestra mesa de juegos en 3D</p>
  </header>

<model-viewer
 id="mesa"
 src="mesa.glb"
 camera-controls
 touch-action="pan-y"
 auto-rotate
 shadow-intensity="1"
 exposure="1"
 ar
 ar-modes="webxr scene-viewer quick-look"
 camera-orbit="0deg 70deg 105%"
 field-of-view="30deg">

```
<button
  slot="ar-button"
  style="
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
  ">
  📱 Ver en mi espacio
</button>
```

  </model-viewer>

  <div class="botones">
    <button onclick="document.getElementById('mesa').resetTurntableRotation()">
      🔄 Reiniciar vista
    </button>
  </div>

</body>
</html>
