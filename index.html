<!DOCTYPE html>

<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mamalona LED</title>

  <script type="module"
    src="https://unpkg.com/@google/model-viewer@4.0.0/dist/model-viewer.min.js">
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    header {
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    p {
      margin: 0;
      color: #aaa;
    }

    model-viewer {
      width: 100%;
      height: 75vh;
      min-height: 500px;
      background: #222;
    }

    #ar-button {
      position: absolute;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);

      background: #168cff;
      color: white;
      border: none;
      border-radius: 12px;

      padding: 15px 25px;
      font-size: 17px;
      font-weight: bold;

      box-shadow: 0 4px 15px rgba(0,0,0,.4);
      cursor: pointer;
    }

    #ar-button:hover {
      background: #006edc;
    }
  </style>

</head>

<body>

  <header>
    <h1>🎲 MAMALONA LED</h1>
    <p>Explora la mesa en 3D y colócala en tu espacio</p>
  </header>

<model-viewer
src="./mesa.glb"
alt="Mesa Mamalona LED"

```
camera-controls
touch-action="pan-y"
auto-rotate

shadow-intensity="1"
exposure="1"

ar
ar-modes="webxr scene-viewer quick-look">

<button slot="ar-button" id="ar-button">
  📱 Ver en mi espacio
</button>
```

  </model-viewer>

</body>
</html>
